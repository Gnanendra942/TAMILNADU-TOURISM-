<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2d0a16" />
      <stop offset="60%" stop-color="#140207" />
      <stop offset="100%" stop-color="#080104" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa7a1e" />
    </linearGradient>

    <!-- Shimmering Text Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7d070">
        <animate attributeName="stop-color" values="#f7d070; #ffffff; #d4af37; #f7d070" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff; #d4af37; #f7d070; #ffffff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#d4af37">
        <animate attributeName="stop-color" values="#d4af37; #f7d070; #ffffff; #d4af37" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#d4af37;#c17a3d;#8a1538;#d4af37" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8a1538" stop-opacity="0.3">
        <animate attributeName="stop-color" values="#8a1538;#d4af37;#c17a3d;#8a1538" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c17a3d" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#c17a3d;#8a1538;#d4af37;#c17a3d" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .star {
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
    .pulse-gopuram {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.12; transform: scale(1); }
      50% { opacity: 0.24; transform: scale(1.02); }
    }
    .badge-pill {
      transition: all 0.3s ease;
    }
    .float-slow {
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>

  <!-- Card Frame -->
  <rect x="8" y="8" width="944" height="304" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Temple Gopuram Architectural Silhouette -->
  <g class="pulse-gopuram" fill="none" stroke="#d4af37" stroke-width="1.2">
    <!-- Center Gopuram Structure -->
    <path d="M480,45 L495,65 L465,65 Z" fill="#d4af37" fill-opacity="0.1" />
    <path d="M460,65 L500,65 L508,95 L452,95 Z" />
    <path d="M448,95 L512,95 L520,130 L440,130 Z" />
    <path d="M435,130 L525,130 L536,170 L424,170 Z" />
    <path d="M420,170 L540,170 L552,215 L408,215 Z" />
    <path d="M400,215 L560,215 L575,265 L385,265 Z" />
    <line x1="480" y1="35" x2="480" y2="45" stroke-width="2" />
    <circle cx="480" cy="33" r="3" fill="#d4af37" />
    <!-- Tier Details -->
    <line x1="440" y1="112" x2="520" y2="112" stroke-dasharray="3,3" />
    <line x1="425" y1="150" x2="535" y2="150" stroke-dasharray="3,3" />
    <line x1="410" y1="192" x2="550" y2="192" stroke-dasharray="3,3" />
  </g>

  <!-- Ambient Golden Floating Dust Particles -->
  <g fill="#ffe699">
    <circle class="star" cx="120" cy="70" r="1.8" style="animation-delay: 0.2s;" />
    <circle class="star" cx="240" cy="190" r="1.2" style="animation-delay: 1.4s;" />
    <circle class="star" cx="180" cy="240" r="2.2" style="animation-delay: 2.1s;" />
    <circle class="star" cx="320" cy="80" r="1.5" style="animation-delay: 0.8s;" />
    <circle class="star" cx="640" cy="90" r="1.6" style="animation-delay: 1.1s;" />
    <circle class="star" cx="720" cy="220" r="2.0" style="animation-delay: 0.5s;" />
    <circle class="star" cx="820" cy="75" r="1.4" style="animation-delay: 1.9s;" />
    <circle class="star" cx="870" cy="170" r="1.9" style="animation-delay: 2.6s;" />
    <circle class="star" cx="480" cy="20" r="2.5" style="animation-delay: 1.7s;" />
  </g>

  <!-- Ornamental Corner Accents -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Top-Left -->
    <path d="M28,45 L28,28 L45,28" />
    <circle cx="28" cy="28" r="3" fill="#d4af37" />
    <!-- Top-Right -->
    <path d="M932,45 L932,28 L915,28" />
    <circle cx="932" cy="28" r="3" fill="#d4af37" />
    <!-- Bottom-Left -->
    <path d="M28,275 L28,292 L45,292" />
    <circle cx="28" cy="292" r="3" fill="#d4af37" />
    <!-- Bottom-Right -->
    <path d="M932,275 L932,292 L915,292" />
    <circle cx="932" cy="292" r="3" fill="#d4af37" />
  </g>

  <!-- Upper Pill Badge -->
  <g class="float-slow" transform="translate(0, 0)">
    <rect x="365" y="44" width="230" height="28" rx="14" fill="#8a1538" fill-opacity="0.4" stroke="#d4af37" stroke-width="1" />
    <circle cx="380" cy="58" r="4" fill="#50e3c2">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="480" y="63" fill="#ffe699" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">
      AUTHENTIC DISCOVERY
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="480" y="138" fill="url(#shimmerGrad)" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="44" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#glow)">
    TAMIL NADU TOURISM
  </text>
  <text x="480" y="138" fill="url(#shimmerGrad)" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="44" font-weight="900" letter-spacing="4" text-anchor="middle">
    TAMIL NADU TOURISM
  </text>

  <!-- Glowing Underline with Center Kalasam / Diamond Motif -->
  <g filter="url(#subtleGlow)">
    <line x1="280" y1="158" x2="455" y2="158" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="480,152 486,158 480,164 474,158" fill="#ffe699" />
    <circle cx="480" cy="158" r="1.5" fill="#8a1538" />
    <line x1="505" y1="158" x2="680" y2="158" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Subtitle -->
  <text x="480" y="194" fill="#f0d5ba" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" letter-spacing="2.5" text-anchor="middle">
    EXPERIENCE ANCIENT TEMPLES • MISTY PEAKS • PRISTINE COASTS • LIVING HERITAGE
  </text>

  <!-- Feature Pills Footer in Banner -->
  <g transform="translate(130, 230)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#200610" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />
      <text x="77" y="21" fill="#ffe699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Pure Vanilla Web</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#200610" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />
      <text x="82" y="21" fill="#ffe699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🗺️ Interactive Vector Map</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#200610" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />
      <text x="82" y="21" fill="#ffe699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">📅 Custom Trip Planner</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#200610" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />
      <text x="75" y="21" fill="#ffe699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✨ Zero Dependencies</text>
    </g>
  </g>
</svg>
